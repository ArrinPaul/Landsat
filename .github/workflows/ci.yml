name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Contract Tests
        run: npm run test:contracts

      - name: Build
        run: npm run build

      # Blocks on critical advisories in production dependencies. Dev-only
      # tooling does not ship, and the remaining high advisories have no
      # upstream fix yet (see the report step below).
      - name: Security Audit (no critical in production deps)
        run: npm run security:audit

      # Informational: lists high advisories in production dependencies
      # without failing the build, so they stay visible.
      - name: Security Audit report (high, non-blocking)
        continue-on-error: true
        run: npm run security:audit:report
